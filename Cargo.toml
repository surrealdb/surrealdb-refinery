[package]
name = "surrealdb_refinery"
edition = "2024"
[dependencies]

# The lower bounds name a pre-release deliberately. Cargo matches a pre-release
# version only against a comparator that carries one on the same
# major.minor.patch, so a plain `3.0.0` here can never resolve against the 3.3
# pre-release line, whatever the consumer asks for. Naming `3.3.0-beta.3` is
# what lets a consumer on that line depend on this crate at all; it still
# accepts every later 3.x release.
surrealdb-types = { version = ">=3.3.0-beta.3, <4" }
# No engine or protocol features. This crate is a migration driver: it runs
# against whatever `Surreal<Any>` the caller hands it and never opens a
# connection of its own outside tests, so the consumer decides which engines to
# link. Enabling them here forced every consumer to compile all three key-value
# engines, RocksDB included, because Cargo unifies features across the graph.
surrealdb = { version = ">=3.3.0-beta.3, <4", default-features = false }
serde_json = "1.0.143"
serde = { version = "1.0.219", features = ["derive"] }
log = "0.4.14"
tokio = { version = "1.47.1", features = ["macros", "time", "rt-multi-thread"] }
refinery = { git = "https://github.com/manelmontilla/refinery", branch = "surql-files" }
refinery-core = { git = "https://github.com/manelmontilla/refinery", branch = "surql-files", features = [
    "futures",
] }

anyhow = "1.0.99"
time = { version = "0.3.41", features = ["formatting", "parsing"] }
chrono = { version = "0.4.41", features = ["serde"] }
async-trait = "0.1.89"


[dev-dependencies]
# The tests connect to `mem://`, so they need the in-process engine that the
# dependency above deliberately leaves to the consumer.
surrealdb = { version = ">=3.3.0-beta.3, <4", features = ["kv-mem"] }
env_logger = "0.11.8"
maplit = "1.0.2"
serde_json = "1.0.143"
testing_logger = "0.1.1"
