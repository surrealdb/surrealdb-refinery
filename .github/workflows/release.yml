name: Release

# Creates the GitHub release for a version tag, with notes taken from the
# matching CHANGELOG section.
#
# Publishing to crates.io is deliberately NOT here: it needs a
# CARGO_REGISTRY_TOKEN secret, and `cargo publish` is run by hand. To automate
# it later, add the secret and a `cargo publish` step to this job.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag pushed before the version bump landed would otherwise produce a
      # release describing a version the tagged tree does not contain.
      - name: Check the tag matches the manifest
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest="$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${manifest}"
            exit 1
          fi
          echo "tag and manifest agree on ${manifest}"

      - name: Take the release notes from the changelog
        run: |
          tag="${GITHUB_REF_NAME#v}"
          awk -v v="$tag" '$0 ~ "^## "v" " {f=1; next} f && /^## / {exit} f' \
            CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for ${tag}"
            exit 1
          fi
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file notes.md \
            --verify-tag
